name: valorant_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  change_app_package_name: ^1.5.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # hive no sql database
  hive: ^2.2.3
  hive_generator: ^2.0.1
  hive_flutter: ^1.1.0
  # path
  path_provider: ^2.1.5
  # get it singleton
  get_it: ^8.0.3
  # async
  async: ^2.12.0
  # equatable
  equatable: ^2.0.7
  # state manager
  flutter_bloc: ^9.1.1
  # interceptor
  dio: ^5.8.0+1
  dio_retry_plus: ^2.0.8
  # internet check
  internet_connection_checker: ^3.0.1
  # box
  gap: ^3.0.1
  # svg render
  flutter_svg: ^2.1.0
  # cached image
  cached_network_image: ^3.4.1
  # native splash
  flutter_native_splash: ^2.3.3
  # firebase
  firebase_core: ^3.13.1
  firebase_analytics: ^11.4.6
  firebase_messaging: ^15.2.6
  firebase_crashlytics: ^4.3.6
  firebase_performance: ^0.10.1+6
  cloud_firestore: ^5.6.8
  # local notification
  flutter_local_notifications: ^19.2.1
  # router
  go_router: ^15.1.2
  #zoom tap
  zoom_tap_animation: ^1.1.0
  #animation
  animate_do: ^4.2.0
  #shimmer
  shimmer: ^3.0.0
  #lottie
  lottie: ^3.3.1
  #photo_view
  photo_view: ^0.15.0
  #video_player
  video_player: ^2.9.5
  #chewie
  chewie: ^1.11.3
  #url_launcher
  url_launcher: ^6.3.1
  #flutter_downloader
  flutter_downloader: ^1.12.0
  #permission_handler
  permission_handler: ^12.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/locale/
    - assets/fonts/
    - assets/images/
    - assets/icons/
  fonts:
    - family: AppIcons
      fonts:
        - asset: assets/fonts/AppIcons.ttf


    - family: Bowlby One SC
      fonts:
        - asset: assets/fonts/Bowlby/BowlbyOneSC-Regular.ttf
